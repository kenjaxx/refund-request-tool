<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Refund Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="desk-header">
    <span class="eyebrow">Support Desk</span>
    <h1>Refund Ledger</h1>
  </header>

  <main class="desk">
    <section class="intake-slip">
      <h2>New Intake</h2>
      <form id="refund-form">
        <div class="field">
          <label for="customerName">Customer name</label>
          <input type="text" id="customerName" required />
        </div>
        <div class="field">
          <label for="customerEmail">Customer email</label>
          <input type="email" id="customerEmail" required />
        </div>
        <div class="field">
          <label for="amount">Refund amount (USD)</label>
          <input type="number" id="amount" min="0.01" step="0.01" required />
        </div>
        <div class="field">
          <label for="reason">Reason</label>
          <textarea id="reason" rows="3" required></textarea>
        </div>
        <button type="submit">File Request</button>
        <p id="form-error" class="error-message"></p>
      </form>
    </section>

    <section class="ledger">
      <div class="ledger-header">
        <h2>Ledger</h2>
        <span id="ledger-count" class="ledger-count"></span>
        <div class="filter">
          <label for="status-filter">Status</label>
          <select id="status-filter">
            <option value="">All</option>
            <option value="Pending">Pending</option>
            <option value="Approved">Approved</option>
            <option value="Rejected">Rejected</option>
            <option value="Refunded">Refunded</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </div>
      </div>

      <table id="ledger-table">
        <thead>
          <tr>
            <th>Ticket</th>
            <th>Customer</th>
            <th>Amount</th>
            <th>Reason</th>
            <th>Filed</th>
            <th>Status</th>
            <th>Update</th>
          </tr>
        </thead>
        <tbody id="ledger-body"></tbody>
      </table>
      <p id="empty-state" class="empty-state" style="display:none;">No entries in the ledger yet.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
